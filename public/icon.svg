<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Resistor Calculator</title>
  <defs>
    <clipPath id="body">
      <rect x="126" y="196" width="260" height="120" rx="56" />
    </clipPath>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.22" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1f3a68" />
  <!-- 4.7 kΩ ±5%: yellow, violet, red, gold -->
  <g transform="rotate(-45 256 256)">
    <rect x="40" y="244" width="432" height="24" rx="12" fill="#c7ced6" />
    <rect x="126" y="196" width="260" height="120" rx="56" fill="#ecd9ad" />
    <g clip-path="url(#body)">
      <rect x="164" y="196" width="26" height="120" fill="#fdd835" />
      <rect x="210" y="196" width="26" height="120" fill="#8e24aa" />
      <rect x="256" y="196" width="26" height="120" fill="#e53935" />
      <rect x="326" y="196" width="26" height="120" fill="#d4a72c" />
      <rect x="126" y="196" width="260" height="120" fill="url(#shade)" />
    </g>
  </g>
</svg>
