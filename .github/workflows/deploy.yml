name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a running deploy is never cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # also checks the service worker's precache list
      # No configure-pages step: its outputs aren't needed (base is set in vite.config.ts) and
      # it needs `pages: read`, which this job doesn't have.
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    # Only master is deployed; pull requests and other branches only build and test.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
